version: 2

models:

  - name: dim_product
    description: "Dimension containing descriptive information about products, with one row per product"
    columns:
      - name: product_key
        description: "Unique generated key for every product"
        tests:
          - not_null
          - unique
      - name: product_id
        description: "Unique product id"
        tests:
          - not_null
          - unique
      - name: product_price
        description: "Product price in usd"
        tests:
          - positive_value

  - name: dim_date
    description: "Calendar dimension used for time-based analysis, with one row per day"
    columns:
      - name: date_key
        description: "Unique generated key for every day"
        tests:
          - not_null
          - unique
      - name: full_date
        tests:
          - not_null
          - unique

  - name: fct_orders
    description: "Fact table representing customer orders, with one row per order"
    columns:
      - name: order_id
        description: "Unique order id"
        tests:
          - not_null
          - unique
      - name: order_key
        description: "Unique generated key for every order"
        tests:
          - not_null
          - unique
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('dim_date')
                field: date_key
      - name: quantity
        description: "The number of items in every order"
        tests:
          - not_null
          - positive_value
      - name: price_usd
        description: "The total price of a unique order"
        tests:
          - not_null
          - positive_value
      - name: cost_of_good
        description: "The global cost of goods in every order"
        tests:
          - not_null
          - positive_value

  - name: fct_order_items
    description: "Fact table representing individual items included in orders, with one row per order item"
    columns:
      - name: order_item_key
        description: "Unique generated key for every order item"
        tests:
          - not_null
          - unique
      - name: order_item_id
        description: "unique order item id"
        tests:
          - not_null
          - unique
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: order_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: price_usd
        description: "The price of every product"
        tests:
          - not_null
          - positive_value
      - name: cost_of_good
        tests:
          - not_null
          - positive_value
      - name: margin_usd
        tests:
          - not_null
      - name: is_refunded
        description: "Is this order item refunded after selling it"
        tests:
          - not_null

  - name: fct_product_sales
    description: "Daily aggregated sales fact table, with one row per product per day"
    columns:
      - name: product_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: product_id
        tests:
          - not_null
      - name: unit_sold
        description: "Number of units sold for the product on the given day"
        tests:
          - not_null
          - non_negative_value
      - name: order_count
        description: "Number of distinct orders containing the product on the given day"
        tests:
          - not_null
          - non_negative_value
      - name: total_sales
        description: "Total sales revenue generated by the product on the given day"
        tests:
          - not_null
          - non_negative_value
      - name: total_goods
        description: "Total cost of goods sold for the product on the given day"
        tests:
          - not_null
          - non_negative_value
      - name: n_refunded
        description: "Number of refunded order items for the product on the given day"
        tests:
          - not_null
          - non_negative_value

  - name: fct_website_pageviews
    description: "Fact table representing website pageviews, with one row per pageview"
    columns:
      - name: pageview_key
        tests:
          - not_null
          - unique
      - name: website_pageview_id
        tests:
          - not_null
          - unique
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: session_key
        tests:
          - not_null
      - name: website_session_id
        tests:
          - not_null
